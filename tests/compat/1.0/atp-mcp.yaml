# Agent Trust Plane MCP proxy config (generated by `atp mcp init`; edit freely).
# Generated from: python -m notes_mcp_server
# tools/list said:
#   read-only  : list_notes, read_note
#   destructive: delete_note
#   other      : write_note
# NOTE: tools the server marks destructive get 'notes:destroy', which is NOT delegated: delete_note
# NOTE: readOnlyHint/destructiveHint come from the server and are unverified; review every capability before relying on it
# `authority` is what the local human delegates to the session agent; tools whose
# capability is not listed there are denied. Unlisted tools are denied and hidden.
version: 1
server_name: notes
upstream:
  command: python
  args:
  - -m
  - notes_mcp_server
authority:
  capabilities:
  - notes:read
  - notes:write
  resource_scope:
  - '*'
policy_set: notes-v1
tools:
- mcp_tool: delete_note
  tool: mcp.notes
  action: delete_note
  capability: notes:destroy
  resource_template: id:{id}
  description: Delete a note permanently.
- mcp_tool: list_notes
  tool: mcp.notes
  action: list_notes
  capability: notes:read
  resource_template: tool:list_notes
  description: List the ids of all notes.
- mcp_tool: read_note
  tool: mcp.notes
  action: read_note
  capability: notes:read
  resource_template: id:{id}
  description: Return the text of a note.
- mcp_tool: write_note
  tool: mcp.notes
  action: write_note
  capability: notes:write
  resource_template: id:{id}
  description: Create or overwrite a note.
