[project]
name = "atp-gateway"
version = "0.3.2"
description = "Agent Trust Plane: FastAPI trust gateway (authorize, execute, traces, replay)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "atp-core",
  "atp-identity",
  "atp-policy",
  "atp-audit",
  "atp-adapter-http",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic-settings>=2.7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atp_gateway"]

[tool.uv.sources]
atp-audit = { workspace = true }
atp-core = { workspace = true }
atp-adapter-http = { workspace = true }
atp-identity = { workspace = true }
atp-policy = { workspace = true }
