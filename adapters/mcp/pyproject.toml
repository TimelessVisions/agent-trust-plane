[project]
name = "atp-adapter-mcp"
version = "0.1.0"
description = "Agent Trust Plane: MCP tool-call interceptor"
requires-python = ">=3.12"
dependencies = [
  "atp-core",
  "atp-adapter-http",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atp_adapter_mcp"]

[tool.uv.sources]
atp-adapter-http = { workspace = true }
atp-core = { workspace = true }
