[project]
name = "atp-adapter-mcp"
version = "0.3.0"
description = "Agent Trust Plane: MCP tool-call interceptor"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "atp-core",
  "atp-adapter-http",
  "mcp>=2.2,<3",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atp_adapter_mcp"]

[tool.uv.sources]
atp-adapter-http = { workspace = true }
atp-core = { workspace = true }
