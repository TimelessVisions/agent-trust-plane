[project]
name = "atp-bench"
version = "0.0.1"
description = "Model-free replay benchmark for agent-trust-plane over AgentDojo suites."
requires-python = ">=3.12"
dependencies = [
  "agent-trust-plane",
  "agentdojo==0.1.35",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atp_bench"]

[tool.uv.sources]
agent-trust-plane = { path = "..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:langsmith.*"]
