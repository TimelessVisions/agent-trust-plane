# Hand-reviewed classification of every AgentDojo v1.2.1 tool, per suite.
# readonly: no mutation of the environment that matters to a task's utility or
# security check (reads, searches, lookups). state_changing: sends, creates,
# deletes, updates, reserves, shares, posts, schedules.
# Judgement calls:
#   workspace.get_unread_emails marks emails read inside AgentDojo; classified
#     readonly because it exposes no new capability and is not a security goal.
#   slack.get_webpage appends the URL to a request log; classified readonly (a
#     fetch), though a URL can carry data. Revisit if a metric needs it.
workspace:
  readonly:
    - get_unread_emails
    - get_sent_emails
    - get_received_emails
    - get_draft_emails
    - search_emails
    - search_contacts_by_name
    - search_contacts_by_email
    - get_current_day
    - search_calendar_events
    - get_day_calendar_events
    - search_files_by_filename
    - get_file_by_id
    - list_files
    - search_files
  state_changing:
    - send_email
    - delete_email
    - create_calendar_event
    - cancel_calendar_event
    - reschedule_calendar_event
    - add_calendar_event_participants
    - append_to_file
    - create_file
    - delete_file
    - share_file
travel:
  readonly:
    - get_user_information
    - get_all_hotels_in_city
    - get_hotels_prices
    - get_rating_reviews_for_hotels
    - get_hotels_address
    - get_all_restaurants_in_city
    - get_cuisine_type_for_restaurants
    - get_restaurants_address
    - get_rating_reviews_for_restaurants
    - get_dietary_restrictions_for_all_restaurants
    - get_contact_information_for_restaurants
    - get_price_for_restaurants
    - check_restaurant_opening_hours
    - get_all_car_rental_companies_in_city
    - get_car_types_available
    - get_rating_reviews_for_car_rental
    - get_car_fuel_options
    - get_car_rental_address
    - get_car_price_per_day
    - search_calendar_events
    - get_day_calendar_events
    - get_flight_information
  state_changing:
    - create_calendar_event
    - cancel_calendar_event
    - reserve_hotel
    - reserve_car_rental
    - reserve_restaurant
    - send_email
banking:
  readonly:
    - get_iban
    - get_balance
    - get_most_recent_transactions
    - get_scheduled_transactions
    - read_file
    - get_user_info
  state_changing:
    - send_money
    - schedule_transaction
    - update_scheduled_transaction
    - update_password
    - update_user_info
slack:
  readonly:
    - get_channels
    - read_channel_messages
    - read_inbox
    - get_users_in_channel
    - get_webpage
  state_changing:
    - add_user_to_channel
    - send_direct_message
    - send_channel_message
    - invite_user_to_slack
    - remove_user_from_slack
    - post_webpage
