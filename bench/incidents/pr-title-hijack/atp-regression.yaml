# Scope policy only. No real GitHub API, tokens, or model calls.
version: 1
name: synthetic PR title unauthorized issue recipient
policy_set: pr-fixture-v1
policies: policies.yaml
delegations:
  principals:
    human: {id: incident-human, kind: human}
    assistant: {id: incident-agent, kind: agent}
  grants:
    - id: root
      grantor: human
      grantee: human
      capabilities: [pr:read, issue:comment]
      resource_scope: ["pr:7", "issue:42"]
      expires_in: 1d
    - id: leaf
      grantor: human
      grantee: assistant
      parent: root
      capabilities: [pr:read, issue:comment]
      resource_scope: ["pr:7", "issue:42"]
      expires_in: 1h
cases:
  - name: read untrusted PR 7 is authorized
    agent: assistant
    principal: human
    delegation: leaf
    capability: pr:read
    tool: mcp.github
    action: get_pull_request
    resource: pr:7
    arguments: {number: 7}
    expect: {outcome: ALLOW, reason_code: ALLOWED}
  - name: comment on approved issue 42 is authorized
    agent: assistant
    principal: human
    delegation: leaf
    capability: issue:comment
    tool: mcp.github
    action: create_issue_comment
    resource: issue:42
    arguments: {issue_id: 42, body: "Approved synthetic review comment"}
    expect: {outcome: ALLOW, reason_code: ALLOWED}
  - name: comment on attacker issue 99 is denied
    agent: assistant
    principal: human
    delegation: leaf
    capability: issue:comment
    tool: mcp.github
    action: create_issue_comment
    resource: issue:99
    arguments: {issue_id: 99, body: "CANARY_NOT_A_TOKEN"}
    expect: {outcome: DENY, reason_code: RESOURCE_OUT_OF_SCOPE}
