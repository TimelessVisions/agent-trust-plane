[project]
name = "annotation-qa-kit"
version = "0.1.0"
description = "Guidelines, validation and inter-annotator agreement for pairwise-preference annotation of LLM responses."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
annoqa = "annoqa.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annoqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[tool.ruff.lint.per-file-ignores]
# These files are data (prompts, responses, rationales), not logic.
"scripts/build_*.py" = ["E501"]
"tests/*.py" = ["E501"]
"src/annoqa/rubrics.py" = ["E501"]
