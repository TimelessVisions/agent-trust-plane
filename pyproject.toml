[project]
name = "agent-trust-plane"
version = "0.3.2"
description = "Authorization boundary and security regression testing for AI agent tool calls (MCP): decide on arguments against delegated authority, bind decisions to single-use grants, replay, and pin denials as CI tests. Experimental."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "George Gakravyi", email = "george@agentcommercegateway.com" }]
keywords = [
  "ai-agents",
  "mcp",
  "model-context-protocol",
  "agent-security",
  "authorization",
  "security-testing",
  "regression-testing",
  "llm-security",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Environment :: Console",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "mcp>=2.2,<3",
]

[project.urls]
Homepage = "https://github.com/TimelessVisions/agent-trust-plane"
Repository = "https://github.com/TimelessVisions/agent-trust-plane"
Issues = "https://github.com/TimelessVisions/agent-trust-plane/issues"
Documentation = "https://github.com/TimelessVisions/agent-trust-plane/tree/main/docs"
Changelog = "https://github.com/TimelessVisions/agent-trust-plane/blob/main/CHANGELOG.md"
Security = "https://github.com/TimelessVisions/agent-trust-plane/blob/main/SECURITY.md"

[project.scripts]
atp = "atp_cli.main:main"
# Same CLI under the distribution name so `uvx agent-trust-plane …` works
# (uvx runs the executable that matches the package name).
agent-trust-plane = "atp_cli.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "packages/core/src/atp_core",
  "packages/identity/src/atp_identity",
  "packages/policy/src/atp_policy",
  "packages/audit/src/atp_audit",
  "packages/evals/src/atp_evals",
  "services/gateway/src/atp_gateway",
  "adapters/http/src/atp_adapter_http",
  "adapters/mcp/src/atp_adapter_mcp",
  "packages/cli/src/atp_cli",
  "examples/finance-agent/src/finance_agent",
  "examples/notes-mcp-server/src/notes_mcp_server",
]

[tool.hatch.build.targets.sdist]
include = ["packages/*/src", "services/gateway/src", "adapters/*/src", "examples/*/src", "README.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = [
  "atp-core",
  "atp-identity",
  "atp-policy",
  "atp-audit",
  "atp-gateway",
  "atp-evals",
  "atp-adapter-http",
  "atp-adapter-mcp",
  "finance-agent",
  "notes-mcp-server",
  "atp-cli",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "ruff>=0.9",
  "mypy>=1.14",
  "types-PyYAML>=6.0",
  "hypothesis>=6.100",
]

[tool.uv]
# Pin the build backend so a wheel built anywhere (CI, a maintainer's
# machine) from the same tag is byte-identical: the backend version is
# written into the wheel's WHEEL file.
build-constraint-dependencies = ["hatchling==1.32.0"]

[tool.uv.workspace]
members = [
  "packages/*",
  "services/gateway",
  "adapters/*",
  "examples/finance-agent",
  "examples/notes-mcp-server",
]

[tool.uv.sources]
atp-core = { workspace = true }
atp-identity = { workspace = true }
atp-policy = { workspace = true }
atp-audit = { workspace = true }
atp-gateway = { workspace = true }
atp-evals = { workspace = true }
atp-adapter-http = { workspace = true }
atp-adapter-mcp = { workspace = true }
finance-agent = { workspace = true }
notes-mcp-server = { workspace = true }
atp-cli = { workspace = true }

[tool.pytest.ini_options]
testpaths = [
  "packages/core/tests",
  "packages/identity/tests",
  "packages/policy/tests",
  "packages/audit/tests",
  "packages/evals/tests",
  "services/gateway/tests",
  "adapters/http/tests",
  "adapters/mcp/tests",
  "examples/finance-agent/tests",
  "examples/notes-mcp-server/tests",
  "packages/cli/tests",
]
addopts = "-q --strict-markers --import-mode=importlib --basetemp=.pytest-tmp"
pythonpath = [
  "packages/core/tests",
  "packages/identity/tests",
  "packages/policy/tests",
  "packages/audit/tests",
  "packages/evals/tests",
  "services/gateway/tests",
  "adapters/http/tests",
  "adapters/mcp/tests",
  "examples/finance-agent/tests",
  "examples/notes-mcp-server/tests",
  "packages/cli/tests",
]
filterwarnings = ["error::DeprecationWarning:atp_.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["atp_cli", "notes_mcp_server", "atp_core", "atp_identity", "atp_policy", "atp_audit", "atp_evals", "atp_gateway", "atp_adapter_http", "atp_adapter_mcp", "finance_agent"]
known-local-folder = ["identity_fixtures", "policy_fixtures", "gateway_fixtures", "evals_fixtures", "agent_fixtures"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B018"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = [
  "packages/core/src",
  "packages/identity/src",
  "packages/policy/src",
  "packages/audit/src",
  "packages/evals/src",
  "services/gateway/src",
  "adapters/http/src",
  "adapters/mcp/src",
  "examples/finance-agent/src",
  "examples/notes-mcp-server/src",
  "packages/cli/src",
]
files = [
  "packages/core/src",
  "packages/identity/src",
  "packages/policy/src",
  "packages/audit/src",
  "packages/evals/src",
  "services/gateway/src",
  "adapters/http/src",
  "adapters/mcp/src",
  "examples/finance-agent/src",
  "examples/notes-mcp-server/src",
]
