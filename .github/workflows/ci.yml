name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -p no:warnings
      - name: adversarial evals (in-process gateway)
        run: uv run python -m atp_evals --report eval-reports/ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report-py${{ matrix.python }}
          path: eval-reports/ci.json
      - name: doctor
        run: uv run atp doctor --port 1
      - name: demos (A injection, B regression, C mcp)
        run: |
          uv run atp demo injection
          uv run atp demo regression --out eval-reports/demo-regression.yaml
          uv run atp demo mcp
      - name: security regression suite (sample)
        run: |
          uv run atp test examples/regression-suite/accounts-payable.yaml --junit eval-reports/regression.xml --json eval-reports/regression.json
          if uv run atp test examples/regression-suite/accounts-payable.yaml --policy-set payments-v1 --quiet; then echo "expected v1 to fail" && exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: regression-report-py${{ matrix.python }}
          path: eval-reports/regression.*

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
