# Publish `agent-trust-plane` to PyPI with Trusted Publishing (OIDC).
#
# Runs ONLY when a GitHub Release is published (an explicit maintainer action)
# or on manual dispatch with a tag name. It never runs on push or pull_request.
# It refuses to build unless the checked-out tag is `v<version>` where <version>
# is exactly the version in pyproject.toml and in the built wheel, so a tag /
# package mismatch fails before anything is uploaded.
#
# Publishing needs a PyPI Trusted Publisher configured for this repository,
# this workflow file name (publish.yml) and the `pypi` environment; see
# docs/release/pypi-publishing.md. There is no PyPI token anywhere.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.3.2). Must already exist and match the package version."
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: build from the tag and validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: resolve the tag
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "refusing: '$TAG' is not a v<major>.<minor>.<patch> tag"; exit 1;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: tag must equal the package version
        id: check
        shell: bash
        run: |
          VERSION=$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "pyproject version: $VERSION  tag: ${{ steps.tag.outputs.tag }}"
          [ "v$VERSION" = "${{ steps.tag.outputs.tag }}" ] || { echo "refusing: tag and package version differ"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: build sdist and wheel from the tagged source
        run: uv build
      - name: built artifacts must carry the same version and MIT metadata
        shell: bash
        run: |
          ls -l dist
          uv run --no-project --with twine twine check dist/*
          uv run --no-project python - <<'EOF'
          import glob, zipfile, sys
          v = "${{ steps.check.outputs.version }}"
          whl = glob.glob(f"dist/agent_trust_plane-{v}-py3-none-any.whl"); sdist = glob.glob(f"dist/agent_trust_plane-{v}.tar.gz")
          assert whl and sdist, ("artifact names do not match the version", glob.glob("dist/*"))
          meta = zipfile.ZipFile(whl[0]).read(f"agent_trust_plane-{v}.dist-info/METADATA").decode()
          assert f"\nVersion: {v}\n" in meta, "wheel Version differs"
          assert "\nLicense-Expression: MIT\n" in meta, "wheel license metadata is not MIT"
          names = zipfile.ZipFile(whl[0]).namelist()
          bad = [n for n in names if any(x in n.lower() for x in (".env", "keys.env", ".db", "/.atp/", "/tests/", "__pycache__"))]
          assert not bad, f"unintended files in wheel: {bad}"
          print("ok:", whl[0], sdist[0])
          EOF
      - name: the wheel installs and runs in isolation
        shell: bash
        run: |
          WHEEL=$(ls dist/*.whl)
          uvx --isolated --from "$WHEEL" atp doctor --port 1
          uvx --isolated --from "$WHEEL" atp demo injection > /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ steps.check.outputs.version }}
          path: dist/
          if-no-files-found: error

  publish:
    name: upload to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    # The `pypi` environment is where required reviewers / branch-tag rules
    # are configured on GitHub, and it is the environment name registered
    # with the PyPI Trusted Publisher.
    environment:
      name: pypi
      url: https://pypi.org/project/agent-trust-plane/${{ needs.build.outputs.version }}/
    permissions:
      contents: read
      id-token: write # the only extra permission: mints the OIDC token for PyPI
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ needs.build.outputs.version }}
          path: dist/
      - name: publish (PEP 740 attestations are generated by the action by default)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          print-hash: true

  verify:
    name: post-publication smoke test from PyPI
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: uvx agent-trust-plane==<version> --help (retries while the index propagates)
        shell: bash
        run: |
          V="${{ needs.build.outputs.version }}"
          for i in 1 2 3 4 5 6; do
            if uvx --isolated --no-cache "agent-trust-plane==$V" --help; then exit 0; fi
            echo "not yet available on PyPI, retry $i"; sleep 30
          done
          exit 1
