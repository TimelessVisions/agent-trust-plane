[project]
name = "atp-identity"
version = "0.3.0"
description = "Agent Trust Plane: principals, delegation grants, chain resolution"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "atp-core",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atp_identity"]

[tool.uv.sources]
atp-core = { workspace = true }
