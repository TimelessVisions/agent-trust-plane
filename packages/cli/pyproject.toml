[project]
name = "atp-cli"
version = "0.3.0"
description = "Agent Trust Plane: the `atp` command (doctor, demo, test, record, serve, mcp-proxy)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "atp-core",
  "atp-gateway",
  "atp-evals",
  "atp-adapter-http",
  "atp-adapter-mcp",
  "finance-agent",
  "notes-mcp-server",
  "pyyaml>=6.0",
]

[project.scripts]
atp = "atp_cli.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atp_cli"]

[tool.uv.sources]
atp-adapter-http = { workspace = true }
atp-adapter-mcp = { workspace = true }
atp-core = { workspace = true }
atp-evals = { workspace = true }
atp-gateway = { workspace = true }
finance-agent = { workspace = true }
notes-mcp-server = { workspace = true }
