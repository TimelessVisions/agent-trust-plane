[project]
name = "atp-audit"
version = "0.3.1"
description = "Agent Trust Plane: hash-chained append-only trace store"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "atp-core",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atp_audit"]

[tool.uv.sources]
atp-core = { workspace = true }
