[project]
name = "atp-core"
version = "0.3.0"
description = "Agent Trust Plane: shared domain models (ActionEnvelope, Decision, reason codes)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "pydantic>=2.10",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atp_core"]

[tool.uv.sources]
