[project]
name = "atp-policy"
version = "0.3.1"
description = "Agent Trust Plane: structured policies and the decision engine"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "atp-core",
  "atp-identity",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atp_policy"]

[tool.uv.sources]
atp-core = { workspace = true }
atp-identity = { workspace = true }
