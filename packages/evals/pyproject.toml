[project]
name = "atp-evals"
version = "0.1.0"
description = "Agent Trust Plane: adversarial evaluation harness"
requires-python = ">=3.12"
dependencies = [
  "atp-core",
  "atp-gateway",
  "finance-agent",
  "httpx>=0.28",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atp_evals"]

[tool.uv.sources]
atp-core = { workspace = true }
atp-gateway = { workspace = true }
finance-agent = { workspace = true }
