# Composite action: run Agent Trust Plane security regression suites.
#
# NOT published to the GitHub Marketplace. Copy this directory into your
# repository (e.g. .github/actions/atp-test) and reference it with
# `uses: ./.github/actions/atp-test`. It needs no secrets and requests no
# permissions beyond reading the checkout; it never executes tools.
name: "Agent Trust Plane regression tests"
description: "Run atp test on security regression suites; fail the job on any changed authorization decision."
inputs:
  suites:
    description: "Glob of suite files"
    required: false
    default: "security/*.yaml"
  source:
    description: "Where to install agent-trust-plane from (git URL with a reviewed tag, a wheel path, or a PyPI spec once published)"
    required: false
    default: "git+https://github.com/<owner>/agent-trust-plane@<tag>"
  python-version:
    description: "Python version for uv"
    required: false
    default: "3.12"
runs:
  using: "composite"
  steps:
    - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
    - shell: bash
      run: uv python install "${{ inputs.python-version }}"
    - shell: bash
      run: uv tool install "${{ inputs.source }}"
    - shell: bash
      run: |
        set -e
        status=0
        for f in ${{ inputs.suites }}; do
          name=$(basename "$f" .yaml)
          atp test "$f" --junit "atp-results-$name.xml" --json "atp-results-$name.json" || status=1
        done
        exit $status
