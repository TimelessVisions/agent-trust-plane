[project]
name = "finance-agent"
version = "0.3.2"
description = "Agent Trust Plane: accounts-payable demo agent"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "atp-core",
  "atp-gateway",
  "atp-adapter-http",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_agent"]

[tool.uv.sources]
atp-adapter-http = { workspace = true }
atp-core = { workspace = true }
atp-gateway = { workspace = true }
